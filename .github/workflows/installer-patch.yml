name: installer patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[installer-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: patch installer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('install-superai-api.sh')
          s = p.read_text()
          replacements = {
              'https://github.com/Sgalsoft/...': 'https://github.com/sgalsoft/superai-installer',
              'https://github.com/Sgalcheung/superai-api': 'https://github.com/sgalcheung/superai-api',
              'GITHUB_OWNER="Sgalcheung"': 'GITHUB_OWNER="sgalcheung"',
              'SuperAI API Installer': 'superai api installer',
              'Description=SuperAI API': 'Description=superai api',
              'Installing SuperAI API': 'Installing superai api',
              'Upgrading SuperAI API': 'Upgrading superai api',
              'SuperAI API is already installed.': 'superai api is already installed.',
              'SuperAI API is not installed.': 'superai api is not installed.',
              'SuperAI API installed successfully.': 'superai api installed successfully.',
              'SuperAI API has been uninstalled.': 'superai api has been uninstalled.',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          old = '''ensure_github_token() {
              if [[ -n "${GITHUB_TOKEN:-}" ]]; then return; fi
              echo; echo -e "${BOLD}GitHub authentication required${RESET}"; echo
              echo "Private repository:"; echo "  https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}"; echo
              echo "Required Fine-grained PAT permission:"; echo "  Contents: Read"; echo
              read_secret "GitHub Fine-grained PAT: " GITHUB_TOKEN
              [[ -n "${GITHUB_TOKEN}" ]] || die "GitHub token cannot be empty."
          }'''
          new = '''ensure_github_token() {
              if [[ -n "${GITHUB_TOKEN:-}" ]]; then
                  return
              fi

              echo
              echo -e "${BOLD}GitHub authentication required${RESET}"
              echo
              echo "The latest superai-api release is private and requires a GitHub token."
              echo
              echo "Repository:"
              echo "  https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}"
              echo
              echo "Required Fine-grained PAT permission:"
              echo "  Contents: Read"
              echo
              echo "The token is used only for this installation and is not saved to disk."
              echo
              read_secret "GitHub Fine-grained PAT: " GITHUB_TOKEN
              [[ -n "${GITHUB_TOKEN}" ]] || die "GitHub token cannot be empty."
          }'''
          if old not in s:
              raise SystemExit('expected token function not found')
          s = s.replace(old, new)
          old = '''verify_github_access() {
              section "Checking GitHub access"
              github_curl "${GITHUB_API}/repos/${GITHUB_OWNER}/${GITHUB_REPO}" >/dev/null
              success "GitHub authentication successful."
          }'''
          new = '''verify_github_access() {
              section "Checking GitHub access"
              if ! github_curl "${GITHUB_API}/repos/${GITHUB_OWNER}/${GITHUB_REPO}" >/dev/null; then
                  echo
                  error "GitHub authentication failed or the token cannot access the private repository."
                  echo
                  echo "Please check:"
                  echo "  - The token is valid and has not expired."
                  echo "  - Repository access includes: ${GITHUB_OWNER}/${GITHUB_REPO}"
                  echo "  - Repository permission: Contents: Read"
                  echo
                  die "Create a Fine-grained PAT with access limited to ${GITHUB_OWNER}/${GITHUB_REPO}."
              fi
              success "GitHub authentication successful."
          }'''
          if old not in s:
              raise SystemExit('expected access function not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
          bash -n install-superai-api.sh

      - name: commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install-superai-api.sh
          if git diff --cached --quiet; then
            echo "No installer changes needed."
            exit 0
          fi
          git commit -m "chore: improve installer token flow [installer-patch]"
          git push
