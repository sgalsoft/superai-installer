name: verify and harden installer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-and-harden:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and validate installer
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('install-superai-api.sh')
          s = p.read_text()

          old = '''cleanup() {
              local exit_code=$?
              if [[ -n "${TMP_DIR:-}" && -d "${TMP_DIR}" ]]; then rm -rf "${TMP_DIR}"; fi
              unset GITHUB_TOKEN 2>/dev/null || true
              exit "${exit_code}"
          }'''
          new = '''cleanup() {
              local exit_code=$?
              if [[ -n "${TMP_DIR:-}" && -d "${TMP_DIR}" ]]; then
                  if [[ "${DEBUG_INSTALL:-0}" == "1" ]]; then
                      warn "Debug mode enabled; temporary files preserved:"
                      echo "  ${TMP_DIR}"
                  else
                      rm -rf "${TMP_DIR}"
                  fi
              fi
              unset GITHUB_TOKEN 2>/dev/null || true
              exit "${exit_code}"
          }'''
          if old not in s: raise SystemExit('cleanup block not found')
          s = s.replace(old, new, 1)

          needle = '    if ! command_exists sha256sum && ! command_exists openssl; then packages+=("openssl"); fi\n'
          if needle not in s: raise SystemExit('dependency block not found')
          s = s.replace(needle, needle + '    command_exists file || packages+=("file")\n', 1)

          old = '''    if [[ -n "${asset_size}" && "${asset_size}" != "null" && "${actual_size}" != "${asset_size}" ]]; then die "Downloaded file size mismatch.\\n\\nExpected:\\n  ${asset_size}\\n\\nActual:\\n  ${actual_size}\\n"; fi
    verify_digest "${asset_json}" "${DOWNLOAD_FILE}"'''
          new = '''    if [[ -n "${asset_size}" && "${asset_size}" != "null" && "${actual_size}" != "${asset_size}" ]]; then
        echo
        error "Downloaded file size mismatch."
        echo
        echo "Expected:"; echo "  ${asset_size}"
        echo
        echo "Actual:"; echo "  ${actual_size}"
        echo
        echo "Downloaded file:"; echo "  ${DOWNLOAD_FILE}"
        if command_exists file; then echo; echo "File type:"; file "${DOWNLOAD_FILE}" || true; fi
        die "Release asset download is incomplete or invalid."
    fi
    if command_exists file; then
        log "Downloaded file type:"
        file "${DOWNLOAD_FILE}" || true
    fi
    verify_digest "${asset_json}" "${DOWNLOAD_FILE}"'''
          if old not in s: raise SystemExit('download block not found')
          s = s.replace(old, new, 1)

          old = '''    cp --preserve=mode,ownership,timestamps "${BINARY_PATH}" "${CURRENT_BACKUP}"; chown "${APP_USER}:${APP_GROUP}" "${CURRENT_BACKUP}"; chmod 0755 "${CURRENT_BACKUP}"
    log "Previous binary backed up:"; log "  ${CURRENT_BACKUP}"'''
          new = '''    cp --preserve=mode,ownership,timestamps "${BINARY_PATH}" "${CURRENT_BACKUP}"
    chown "${APP_USER}:${APP_GROUP}" "${CURRENT_BACKUP}"; chmod 0755 "${CURRENT_BACKUP}"
    if [[ -f "${VERSION_FILE}" ]]; then
        cp --preserve=mode,ownership,timestamps "${VERSION_FILE}" "${CURRENT_BACKUP}.VERSION"
        chown "${APP_USER}:${APP_GROUP}" "${CURRENT_BACKUP}.VERSION"; chmod 0644 "${CURRENT_BACKUP}.VERSION"
    fi
    log "Previous binary backed up:"; log "  ${CURRENT_BACKUP}"
    [[ -f "${CURRENT_BACKUP}.VERSION" ]] && log "Previous version backed up:" && log "  ${CURRENT_BACKUP}.VERSION"'''
          if old not in s: raise SystemExit('backup block not found')
          s = s.replace(old, new, 1)

          old = '''    install -o "${APP_USER}" -g "${APP_GROUP}" -m 0755 "${CURRENT_BACKUP}" "${BINARY_PATH}"; success "Previous binary restored."; return 0'''
          new = '''    install -o "${APP_USER}" -g "${APP_GROUP}" -m 0755 "${CURRENT_BACKUP}" "${BINARY_PATH}"
    if [[ -f "${CURRENT_BACKUP}.VERSION" ]]; then
        install -o "${APP_USER}" -g "${APP_GROUP}" -m 0644 "${CURRENT_BACKUP}.VERSION" "${VERSION_FILE}"
    fi
    success "Previous binary and version restored."; return 0'''
          if old not in s: raise SystemExit('rollback block not found')
          s = s.replace(old, new, 1)

          old = 'restart_and_verify() { systemctl daemon-reload; start_service; wait_for_service || return 1; wait_for_port || true; return 0; }'
          new = 'restart_and_verify() { systemctl daemon-reload; start_service; wait_for_service || return 1; wait_for_port || return 1; return 0; }'
          if old not in s: raise SystemExit('restart block not found')
          s = s.replace(old, new, 1)

          old = '''main() {
    require_root; install_dependencies
    local command="${1:-install}"
    case "${command}" in install) install_command;; upgrade) upgrade_command;; status) status_command;; restart) restart_command;; uninstall) uninstall_command;; help|-h|--help) usage;; *) error "Unknown command: ${command}"; usage; exit 1;; esac
}'''
          new = '''main() {
    require_root
    local command="${1:-install}"
    case "${command}" in
        install|upgrade) install_dependencies ;;
    esac
    case "${command}" in
        install) install_command;;
        upgrade) upgrade_command;;
        status) status_command;;
        restart) restart_command;;
        uninstall) uninstall_command;;
        help|-h|--help) usage;;
        *) error "Unknown command: ${command}"; usage; exit 1;;
    esac
}'''
          if old not in s: raise SystemExit('main block not found')
          s = s.replace(old, new, 1)

          marker = '''  ASSET_NAME
      Optional exact Release asset name.
'''
          replacement = '''  ASSET_NAME
      Optional exact Release asset name.
  DEBUG_INSTALL
      Set to 1 to preserve temporary files under /tmp for troubleshooting.
'''
          if marker not in s: raise SystemExit('usage marker not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s)
          PY

          bash -n install-superai-api.sh
          grep -q 'github_asset_curl' install-superai-api.sh
          grep -q 'DEBUG_INSTALL' install-superai-api.sh
          grep -q 'CURRENT_BACKUP}.VERSION' install-superai-api.sh
          grep -q 'wait_for_port || return 1' install-superai-api.sh
          grep -q 'install|upgrade)' install-superai-api.sh
          git diff --cached --check || true

      - name: Commit validated changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "Sgalsoft"
          git config user.email "18898538842@163.com"
          git add install-superai-api.sh
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No installer changes needed."
            exit 0
          fi
          git commit -m "fix: harden installer rollback and diagnostics"
          git push
